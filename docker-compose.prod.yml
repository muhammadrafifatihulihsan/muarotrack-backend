# ============================================================
# MuaroTrack — Docker Compose PRODUCTION
# Jalankan: docker compose -f docker-compose.prod.yml up -d --build
# Environment dibaca dari file .env.production (buat dari .env.production.example)
# ============================================================

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: muarotrack-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-muarotrack}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # DB TIDAK diekspos ke publik. Hanya bisa diakses dari jaringan internal compose.
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-muarotrack}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muarotrack-api-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-muarotrack}
      MOCK_EXTERNAL: ${MOCK_EXTERNAL:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TIDECHECK_API_KEY: ${TIDECHECK_API_KEY:-}
      WORLDTIDES_API_KEY: ${WORLDTIDES_API_KEY:-}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      SOS_RADIUS_KM: ${SOS_RADIUS_KM:-10.0}
      ZONA_RADIUS_MAKS_KM: ${ZONA_RADIUS_MAKS_KM:-22.0}
      ZONA_JUMLAH_TITIK: ${ZONA_JUMLAH_TITIK:-5}
      BEARING_LAUT_DEG: ${BEARING_LAUT_DEG:-270.0}
      RUN_SCHEDULER: ${RUN_SCHEDULER:-true}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data_prod:
